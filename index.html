<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>stupidlove • Spline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .spline-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #ffffff;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }
    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    LOADING EXPERIENCE
  </div>

  <div class="spline-wrapper">
    <iframe 
      src="https://prod.spline.design/PtxdoKRiTEQr4Smp/scene.splinecode"
      allowfullscreen
      loading="eager"
    ></iframe>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const iframe = document.querySelector('iframe');

    // Hide loader when iframe has loaded
    iframe.addEventListener('load', () => {
      setTimeout(() => {
        loader.classList.add('hidden');
      }, 600);
    });

    // Bonus: Double-click to toggle fullscreen (nice for immersive feel)
    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Keyboard hint (optional subtle)
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName === 'BODY') {
        e.preventDefault();
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      }
    });
  </script>
</body>
</html>
